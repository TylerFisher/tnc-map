<title>Tiny News Collective Member Map</title>

<!-- ============================================================
  TNC MEMBER MAP
  How it works:
  1. Set SHEET_CSV_URL below to your published Google Sheet CSV link
     (File > Share > Publish to web > select the sheet > CSV).
  2. If SHEET_CSV_URL is empty, the map uses the fallback data
     embedded at the bottom of this file, so it works immediately.
  3. Required columns: name, tier, type, city, state, lat, lng,
     description, url, status, notes
     - type "place" rows with lat/lng become pins
     - type "beat" rows appear in the side list
     - rows without coordinates are skipped (counted in the footer)
  Brand colors live in the :root CSS variables just below.
============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />

<style>
  :root {
    /* Edit these to match TNC brand */
    --ink: #20242c;
    --paper: #fcfbf8;
    --line: #e6e2d8;
    --muted: #6b7078;
    --tier-publisher: #0f6b6b;   /* Publisher pins */
    --tier-community: #d96c3f;   /* Community pins */
    --tier-alumni: #7a7e8c;      /* Alumni pins (hollow) */
    --font: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 18px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-right: auto;
  }

  #counts {
    font-size: 12.5px;
    color: var(--muted);
    width: 100%;
    order: 3;
  }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }

  .pill {
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 600;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 12px 5px 9px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color .15s, color .15s;
  }
  .pill .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--c); border: 2px solid var(--c);
    flex: none;
  }
  .pill[data-tier="Alumni"] .dot { background: #fff; }
  .pill[aria-pressed="true"] { border-color: var(--c); color: var(--ink); }
  .pill[aria-pressed="false"] { opacity: .45; }
  .pill:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- Layout ---------- */
  main { flex: 1; display: flex; min-height: 0; }

  #map { flex: 1; min-height: 420px; background: #eef0ef; }

  aside {
    width: 272px;
    flex: none;
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 16px;
  }

  aside h2 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
  }
  aside p.sub {
    font-size: 12px;
    color: var(--muted);
    margin: 4px 0 12px;
    line-height: 1.45;
  }

  .beat-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #fff;
  }
  .beat-card a {
    color: var(--ink);
    font-weight: 600;
    font-size: 13.5px;
    text-decoration: none;
  }
  .beat-card a:hover { text-decoration: underline; }
  .beat-card .desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #fff;
    border-radius: 4px;
    padding: 2px 6px;
    margin-top: 7px;
  }
  .badge.Publisher { background: var(--tier-publisher); }
  .badge.Community { background: var(--tier-community); }
  .badge.Alumni { background: var(--tier-alumni); }

  footer {
    font-size: 11px;
    color: var(--muted);
    padding: 7px 18px;
    border-top: 1px solid var(--line);
  }

  /* ---------- Markers & popups ---------- */
  .pin {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  .pin.Publisher { background: var(--tier-publisher); }
  .pin.Community { background: var(--tier-community); }
  .pin.Alumni { background: #fff; border-color: var(--tier-alumni); box-shadow: 0 0 0 1.5px var(--tier-alumni), 0 1px 4px rgba(0,0,0,.25); }

  .cluster {
    background: var(--ink);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    border: 2.5px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.3);
  }

  .leaflet-popup-content-wrapper { border-radius: 8px; font-family: var(--font); }
  .leaflet-popup-content { margin: 12px 14px; line-height: 1.45; }
  .popup-name { font-weight: 700; font-size: 14px; color: var(--ink); text-decoration: none; }
  .popup-name:hover { text-decoration: underline; }
  .popup-loc { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .popup-desc { font-size: 12.5px; margin-top: 6px; }

  @media (max-width: 720px) {
    main { flex-direction: column; }
    #map { min-height: 380px; }
    aside { width: 100%; border-left: none; border-top: 1px solid var(--line); max-height: 240px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<body>

<header>
  <h1>Our Member Network</h1>
  <div class="filters" role="group" aria-label="Filter by membership tier">
    <button class="pill" data-tier="Publisher" style="--c: var(--tier-publisher)" aria-pressed="true"><span class="dot"></span>Publisher</button>
    <button class="pill" data-tier="Community" style="--c: var(--tier-community)" aria-pressed="true"><span class="dot"></span>Community</button>
    <button class="pill" data-tier="Alumni" style="--c: var(--tier-alumni)" aria-pressed="true"><span class="dot"></span>Alumni</button>
  </div>
  <div id="counts"></div>
</header>

<main>
  <div id="map" role="region" aria-label="Map of Tiny News Collective members"></div>
  <aside>
    <h2>National &amp; Beat-Based Members</h2>
    <p class="sub">Members defined by what they cover rather than where.</p>
    <div id="beat-list"></div>
  </aside>
</main>

<footer id="footnote"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
/* ====================== CONFIG ====================== */
// Paste your published Google Sheet CSV URL between the quotes.
// Leave empty to use the fallback data embedded below.
const SHEET_CSV_URL = "";
/* ==================================================== */

const activeTiers = new Set(["Publisher", "Community", "Alumni"]);
let allRows = [];
let map, clusterGroup;

// Wait until the whole page (including the embedded data block) is parsed
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", start);
} else {
  start();
}

function start() {
  init().catch(err => {
    console.error(err);
    document.getElementById("counts").textContent = "Map error: " + err.message;
  });
}

async function init() {
  if (typeof L === "undefined") {
    document.getElementById("map").innerHTML =
      '<p style="padding:24px;font-size:13px;color:#6b7078">The map library could not load. Check your internet connection, then refresh.</p>';
    return;
  }
  map = L.map("map", { scrollWheelZoom: false, worldCopyJump: true });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    maxZoom: 18
  }).addTo(map);
  map.setView([39.8, -98.5], 4); // shown while data loads

  // If the clustering plugin failed to load, fall back to plain markers
  clusterGroup = (typeof L.markerClusterGroup === "function")
    ? L.markerClusterGroup({
        maxClusterRadius: 36,
        showCoverageOnHover: false,
        iconCreateFunction: c => L.divIcon({
          html: '<div class="cluster" style="width:30px;height:30px">' + c.getChildCount() + "</div>",
          className: "", iconSize: [30, 30]
        })
      })
    : L.featureGroup();
  map.addLayer(clusterGroup);

  const csvText = await loadCsv();
  const parsed = Papa.parse(csvText.trim(), { header: true, skipEmptyLines: true });
  allRows = parsed.data.map(r => ({
    name: (r.name || "").trim(),
    tier: (r.tier || "").trim(),
    type: (r.type || "place").trim().toLowerCase(),
    city: (r.city || "").trim(),
    state: (r.state || "").trim(),
    lat: parseFloat(r.lat),
    lng: parseFloat(r.lng),
    description: (r.description || "").trim(),
    url: (r.url || "").trim()
  })).filter(r => r.name);

  render(true);
  document.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const tier = btn.dataset.tier;
      activeTiers.has(tier) ? activeTiers.delete(tier) : activeTiers.add(tier);
      btn.setAttribute("aria-pressed", activeTiers.has(tier));
      render(false);
    });
  });
}

async function loadCsv() {
  if (SHEET_CSV_URL) {
    try {
      const res = await fetch(SHEET_CSV_URL);
      if (res.ok) return await res.text();
      console.warn("Sheet fetch failed (" + res.status + "); using fallback data.");
    } catch (e) {
      console.warn("Sheet fetch error; using fallback data.", e);
    }
  }
  return document.getElementById("fallback-data").textContent;
}

function render(fitToData) {
  clusterGroup.clearLayers();
  const visible = allRows.filter(r => activeTiers.has(r.tier));

  // Pins
  const pinRows = visible.filter(r => r.type === "place" && isFinite(r.lat) && isFinite(r.lng));
  const markers = pinRows.map(r => {
    const m = L.marker([r.lat, r.lng], {
      icon: L.divIcon({ html: '<div class="pin ' + r.tier + '"></div>', className: "", iconSize: [14, 14], iconAnchor: [7, 7] }),
      title: r.name, alt: r.name
    });
    m.bindPopup(popupHtml(r));
    return m;
  });
  if (typeof clusterGroup.addLayers === "function") {
    clusterGroup.addLayers(markers);
  } else {
    markers.forEach(m => clusterGroup.addLayer(m));
  }

  if (fitToData && markers.length) {
    map.fitBounds(L.featureGroup(markers).getBounds(), { padding: [30, 30], maxZoom: 6 });
  }

  // Beat list
  const beatRows = visible.filter(r => r.type === "beat");
  document.getElementById("beat-list").innerHTML = beatRows.map(r =>
    '<div class="beat-card">' +
      (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.name) + "</a>"
             : '<span style="font-weight:600;font-size:13.5px">' + esc(r.name) + "</span>") +
      (r.description ? '<div class="desc">' + esc(r.description) + "</div>" : "") +
      '<span class="badge ' + r.tier + '">' + esc(r.tier) + "</span>" +
    "</div>"
  ).join("") || '<p class="sub">None in the selected tiers.</p>';

  // Counts
  const count = t => allRows.filter(r => r.tier === t).length;
  const states = new Set(pinRows.map(r => r.state).filter(Boolean));
  document.getElementById("counts").textContent =
    count("Publisher") + " publisher members · " + count("Community") + " community members · " +
    count("Alumni") + " alumni · pins across " + states.size + " states and territories";

  // Footer
  const pending = allRows.filter(r => r.type === "place" && (!isFinite(r.lat) || !isFinite(r.lng))).length;
  document.getElementById("footnote").textContent =
    pending > 0 ? pending + " members will appear once their locations are added to the sheet." : "";
}

function popupHtml(r) {
  const loc = [r.city, r.state].filter(Boolean).join(", ");
  return (r.url
      ? '<a class="popup-name" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.name) + "</a>"
      : '<span class="popup-name">' + esc(r.name) + "</span>") +
    (loc ? '<div class="popup-loc">' + esc(loc) + "</div>" : "") +
    (r.description ? '<div class="popup-desc">' + esc(r.description) + "</div>" : "") +
    '<span class="badge ' + r.tier + '">' + esc(r.tier) + "</span>";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
