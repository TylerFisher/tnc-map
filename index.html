<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny News Collective Member Map</title>
    <meta name="color-scheme" content="light" />
  </head>

  <body>
    <main class="surface">
      <header class="claim">
        <p class="claim__asof" id="as-of"></p>
      </header>

      <figure class="evidence">
        <div
          class="evidence__map"
          id="map"
          role="application"
          aria-label="Map of member newsroom locations. Pan with the arrow keys, zoom with plus and minus."
          aria-describedby="map-caption"
        ></div>
        <figcaption class="visually-hidden" id="map-caption"></figcaption>
      </figure>

      <section class="roster" aria-labelledby="roster-heading">
        <h2 class="visually-hidden" id="roster-heading">All member newsrooms</h2>

        <div class="roster__controls">
          <label class="visually-hidden" for="search">Search member newsrooms</label>
          <input
            class="roster__search"
            id="search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            enterkeyhint="search"
            placeholder="Search newsrooms or places"
          />
          <p class="visually-hidden" id="count-live" role="status" aria-live="polite"></p>
        </div>

        <div class="roster__scroll" id="roster-scroll" tabindex="0">
          <div class="roster__list" id="roster"></div>
          <p class="roster__empty" id="roster-empty" hidden></p>
        </div>
      </section>

      <p class="credit" id="credit"></p>
    </main>

    <noscript>
      <p style="padding: 24px; font-family: sans-serif; font-size: 14px">
        This map needs JavaScript. A full list of Tiny News Collective members is available at
        <a href="https://www.tinynewsco.org/">tinynewsco.org</a>.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
